# ============================================================================
# P1-27（凭证泄露兜底）：访问日志不得记录带 JWT 的 query
#   正常鉴权只走 `Authorization: Bearer`（nginx 默认不记请求头），但存在两个
#   合法例外会把 token 写进 URI：
#     1) /api/notify/stream?token= —— EventSource 不能带自定义头（下方已 access_log off）
#     2) SSO 回调 /?token= —— 进站请求行本身就会被记录，前端清 URL 只是第一道防线
#   因此这里定义一个「命中 token= 就只记无 query 的 URI」的日志格式（$request_nq 并非
#   nginx 核心变量，只能自己拼）。map / log_format 必须位于 http 上下文，
#   本文件由 nginx.conf 的 http{} 直接 include，故写在 server 之外；
#   变量/格式名统一加 chain_ 前缀，避免与同机其他站点冲突。
#   正则写成 [?&]token= 而非 \btoken=：nginx 配置双引号串会吃掉反斜杠，\b 会被拆成 b。
#   取舍：仅对含 token= 的请求去 query，其余请求保留完整 URI，排障能力不降。
# ============================================================================
map $request_uri $chain_log_target {
    default      $request_uri;
    "~*[?&]token=" $uri;
}

log_format chain_credential_safe
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $chain_log_target $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name chain.your-school.edu.cn;

    # 80 → 443 强制跳转（有 HTTPS 证书后启用）
    # return 301 https://$host$request_uri;

    # 未申请证书前先用 HTTP 提供静态
    root /var/www/chain;
    index index.html;

    location ~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/chain;
    }

    # P1-27：本 server 若不显式指定，会继承 http 默认的 combined 格式（含完整 query），
    # 跳 HTTPS 前的 `http://domain/?token=` 首次进站同样会落 JWT，故这里统一换成脱敏格式。
    access_log /var/log/nginx/chain.access.log chain_credential_safe;
}

server {
    listen 443 ssl http2;
    server_name chain.your-school.edu.cn;

    # ===== TLS（certbot 会自动替换为实际路径）=====
    ssl_certificate     /etc/letsencrypt/live/chain.your-school.edu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chain.your-school.edu.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== 前端静态 =====
    root /var/www/chain;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # ===== SPA 历史路由兜底 =====
    location / {
        try_files $uri $uri/ /index.html;
        if ($uri ~* \.(?:js|css|ttf|woff2?|png|jpe?g|svg|gif|ico|webp)$) {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ===== WebSocket（云桌面终端）=====
    location /api/cloud/ws {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== SSE 事件推送（任务 #21：/api/notify/stream 长连接）=====
    # 必须禁缓冲/禁缓存，否则事件帧会被 nginx 攒批延迟下发；长读超时保活心跳连接。
    # EventSource 无法携带自定义头，鉴权走 ?token=（后端与 Bearer 同一验签路径）。
    location /api/notify/ {
        # 任务 #25（安全）：关闭该 location 的访问日志——JWT 以 ?token= 位于 query，
        # 默认 log_format 的 $request 会原样记录完整 URI 导致 JWT 落入日志。
        # 取舍说明：相比自定义 log_format 剔除 query，关日志改动更小且彻底；
        # SSE 重连频率高，日志本身运维价值低，error_log 不受影响仍可用于排障。
        access_log off;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== 其他 API =====
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        client_max_body_size 200m;
        proxy_read_timeout  180s;
        proxy_send_timeout  180s;
        proxy_connect_timeout 10s;
    }

    # ===== 上传静态文件 =====
    location /static/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        expires            7d;
        add_header         Cache-Control "public";
    }

    # ===== 后端健康检查、文档、OpenAPI =====
    location = /health { proxy_pass http://127.0.0.1:8000; }
    location /docs        { proxy_pass http://127.0.0.1:8000; }
    location /openapi.json{ proxy_pass http://127.0.0.1:8000; }

    access_log /var/log/nginx/chain.access.log chain_credential_safe;
    error_log  /var/log/nginx/chain.error.log warn;
}
