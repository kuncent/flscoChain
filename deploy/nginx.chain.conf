server {
    listen 80;
    server_name chain.your-school.edu.cn;

    # 80 → 443 强制跳转（有 HTTPS 证书后启用）
    # return 301 https://$host$request_uri;

    # 未申请证书前先用 HTTP 提供静态
    root /var/www/chain;
    index index.html;

    location ~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/chain;
    }
}

server {
    listen 443 ssl http2;
    server_name chain.your-school.edu.cn;

    # ===== TLS（certbot 会自动替换为实际路径）=====
    ssl_certificate     /etc/letsencrypt/live/chain.your-school.edu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chain.your-school.edu.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== 前端静态 =====
    root /var/www/chain;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # ===== SPA 历史路由兜底 =====
    location / {
        try_files $uri $uri/ /index.html;
        if ($uri ~* \.(?:js|css|ttf|woff2?|png|jpe?g|svg|gif|ico|webp)$) {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ===== WebSocket（云桌面终端）=====
    location /api/cloud/ws {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== 其他 API =====
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        client_max_body_size 200m;
        proxy_read_timeout  180s;
        proxy_send_timeout  180s;
        proxy_connect_timeout 10s;
    }

    # ===== 上传静态文件 =====
    location /static/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        expires            7d;
        add_header         Cache-Control "public";
    }

    # ===== 后端健康检查、文档、OpenAPI =====
    location = /health { proxy_pass http://127.0.0.1:8000; }
    location /docs        { proxy_pass http://127.0.0.1:8000; }
    location /openapi.json{ proxy_pass http://127.0.0.1:8000; }

    access_log /var/log/nginx/chain.access.log;
    error_log  /var/log/nginx/chain.error.log warn;
}
